# Windows: builds the library, examples and tests, warnings as errors,
# runs the tests that need no display or sound card, and builds a project
# against the installed package. One workflow per platform, so each has a
# badge of its own in the README.
name: Windows

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows, MSVC, ${{ matrix.build_type }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      # The Visual Studio generator builds every configuration from one
      # tree, so the configuration is picked at build and test time.
      - name: Configure
        run: cmake -S . -B build -DTGX_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} -L cpu --output-on-failure

      # A project of its own finds the installed package, as a game would.
      # Bash, which stops at the first command that fails; PowerShell would
      # carry on.
      - name: Install and build against it
        shell: bash
        run: |
          prefix="$(cygpath -m "${{ runner.temp }}")/tgx"
          cmake --install build --config ${{ matrix.build_type }} --prefix "$prefix"
          cmake -S tests/install -B build-install -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build-install --config ${{ matrix.build_type }}
          build-install/${{ matrix.build_type }}/tgx_install_check.exe
