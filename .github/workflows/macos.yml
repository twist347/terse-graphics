# macOS: builds the library, examples and tests, warnings as errors,
# runs the tests that need no display or sound card, and builds a project
# against the installed package. One workflow per platform, so each has a
# badge of its own in the README.
name: macOS

on:
  push:
  pull_request:

jobs:
  macos:
    name: macOS, Apple Clang, ${{ matrix.build_type }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      # Everything needed comes with Xcode: GL and Cocoa are system frameworks.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTGX_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build -L cpu --output-on-failure

      # A project of its own finds the installed package, as a game would.
      - name: Install and build against it
        run: |
          cmake --install build --prefix "${{ runner.temp }}/tgx"
          cmake -S tests/install -B build-install \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/tgx"
          cmake --build build-install
          build-install/tgx_install_check
