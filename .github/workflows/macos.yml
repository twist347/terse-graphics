# macOS: builds the library, examples and tests, warnings as errors, runs
# them all (the GPU ones in the runner's own desktop session) and builds a project against the installed package and with tgx
# inside it. One workflow per platform, so each has a
# badge of its own in the README.
name: macOS

on:
  push:
  pull_request:

jobs:
  macos:
    name: macOS, Apple Clang, ${{ matrix.build_type }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      # Everything needed comes with Xcode: GL and Cocoa are system frameworks.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTGX_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build -L cpu --output-on-failure

      # The strictest core profile tgx runs on.
      - name: Test on the GPU
        run: ctest --test-dir build -L gpu --output-on-failure

      # A project of its own finds the installed package, as a game would.
      - name: Install and build against it
        run: |
          cmake --install build --prefix "${{ runner.temp }}/tgx"
          cmake -S tests/install -B build-install \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/tgx"
          cmake --build build-install
          build-install/tgx_install_check

      # The other way in: tgx built inside the project with add_subdirectory.
      - name: Build inside a project
        run: |
          cmake -S tests/install -B build-subdirectory \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DTGX_SOURCE_DIR="$PWD"
          cmake --build build-subdirectory --parallel
          build-subdirectory/tgx_install_check
